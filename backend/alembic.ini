# Alembic configuration. The database URL is NOT set here: alembic/env.py reads
# DATABASE_URL through app.core.config.get_settings(), the same as the app.

[alembic]
script_location = %(here)s/alembic
# Make `app` importable from env.py when running `uv run alembic ...` in backend/.
prepend_sys_path = .
file_template = %%(rev)s
path_separator = os
output_encoding = utf-8

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

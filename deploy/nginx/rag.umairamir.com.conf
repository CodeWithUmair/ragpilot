# /etc/nginx/sites-available/rag.umairamir.com
#
# Install as plain HTTP, then run `certbot --nginx -d rag.umairamir.com`:
# certbot adds the `listen 443 ssl` + certificate lines and the HTTP->HTTPS
# redirect to this file in place.
#
# Routing: FastAPI (127.0.0.1:4000) gets /api/, /health, /version, /docs,
# /openapi.json; everything else goes to Next.js (127.0.0.1:3000).

upstream ragpilot_api { server 127.0.0.1:4000; keepalive 16; }
upstream ragpilot_web { server 127.0.0.1:3000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name rag.umairamir.com;

    # Document uploads (PDF/DOCX) go through /api.
    client_max_body_size 25m;

    # Shared proxy settings.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # ─── FastAPI ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://ragpilot_api;
        proxy_set_header Connection "";

        # Server-Sent Events (streamed chat answers): no buffering, no caching,
        # and long timeouts so slow LLM streams are not cut off.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    location = /health       { proxy_pass http://ragpilot_api; proxy_set_header Connection ""; }
    location = /version      { proxy_pass http://ragpilot_api; proxy_set_header Connection ""; }
    location = /openapi.json { proxy_pass http://ragpilot_api; proxy_set_header Connection ""; }
    location /docs           { proxy_pass http://ragpilot_api; proxy_set_header Connection ""; }

    # ─── Next.js ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://ragpilot_web;
        # Allow WebSocket upgrades (harmless in production, useful if ever needed).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
